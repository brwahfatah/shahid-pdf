<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shahid</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #1a1a2e;
      color: #fff;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      background-color: #0f3460;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #16213e;
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    main {
      flex: 1;
      display: flex;
      padding: 0;
    }

    .pdf-container {
      flex: 1;
      display: flex;
    }

    .pdf-container iframe,
    .pdf-container embed,
    .pdf-container object {
      width: 100%;
      height: 100%;
      border: none;
    }

    .fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2rem;
      text-align: center;
      width: 100%;
    }

    .fallback p {
      font-size: 1.1rem;
      color: #555;
      max-width: 400px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 1.1rem;
      }

      .btn {
        padding: 0.45rem 0.85rem;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Shahid</h1>
    <div>
      <a class="btn" href="Shahid.pdf" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2l5 5h-5V4zM6 20V4h5v7h7v9H6z"/></svg>
        Open PDF
      </a>
      <a class="btn" href="Shahid.pdf" download>
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Download
      </a>
    </div>
  </header>

  <main>
    <div class="pdf-container" id="viewer">
      <iframe src="Shahid.pdf" title="Shahid PDF"></iframe>
    </div>
    <div class="fallback" id="fallback">
      <p>Your browser does not support inline PDF viewing.</p>
      <a class="btn" href="Shahid.pdf" target="_blank" rel="noopener">Open PDF</a>
      <a class="btn" href="Shahid.pdf" download>Download PDF</a>
    </div>
  </main>

  <script>
    var iframe = document.querySelector('#viewer iframe');
    iframe.addEventListener('load', function () {
      try {
        if (iframe.contentDocument && iframe.contentDocument.body.childElementCount === 0) {
          showFallback();
        }
      } catch (e) {}
    });
    iframe.addEventListener('error', showFallback);

    function showFallback() {
      document.getElementById('viewer').style.display = 'none';
      document.getElementById('fallback').style.display = 'flex';
    }
  </script>
</body>
</html>
