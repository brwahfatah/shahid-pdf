<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shahid - Room Visualization</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: #1a1a2e;
      color: #fff;
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.9rem;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      background-color: #0f3460;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #16213e;
    }

    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    main iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Shahid - Room Visualization</h1>
    <div>
      <a class="btn" href="room.html" target="_blank" rel="noopener">Open Fullscreen</a>
      <a class="btn" href="Shahid.pdf" target="_blank" rel="noopener">View PDF</a>
    </div>
  </header>

  <main>
    <iframe src="room.html" title="Shahid Room Visualization" allowfullscreen></iframe>
  </main>
</body>
</html>
